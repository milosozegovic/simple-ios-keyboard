name: MyKeyboard

options:
  bundleIdPrefix: com.imaginaroom
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"

packages:
  KeyboardKit:
    url: https://github.com/KeyboardKit/KeyboardKit.git
    exactVersion: 10.9.5

settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGN_STYLE: Automatic
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: "1.0"

targets:

  MyKeyboard:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Shared
    dependencies:
      # KeyboardKit is a binary xcframework, so it is linked ONLY here.
      # The Keyboard extension imports it without linking, and resolves
      # it at runtime from the host app's Frameworks folder.
      - package: KeyboardKit
        product: KeyboardKit
      - target: Keyboard
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.imaginaroom.simple-keyboard
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: MyKeyboard
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        LD_RUNPATH_SEARCH_PATHS:
          - $(inherited)
          - "@executable_path/Frameworks"

  Keyboard:
    type: app-extension
    platform: iOS
    sources:
      - path: Keyboard
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.imaginaroom.simple-keyboard.Keyboard
        INFOPLIST_FILE: Keyboard/Info.plist
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: MyKeyboard
        SKIP_INSTALL: YES
        LD_RUNPATH_SEARCH_PATHS:
          - $(inherited)
          - "@executable_path/Frameworks"
          - "@executable_path/../../Frameworks"
